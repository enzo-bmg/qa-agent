AWSTemplateFormatVersion: "2010-09-09"
Description: S3 bucket for AgentCore knowledge base documents

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name in lowercase
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Use 3-63 lowercase letters, numbers, dots, or hyphens; start and end with a letter or number.
Resources:
  S3AccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: KnowledgeBaseBucketReadWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}"
              - Sid: ReadWriteObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}/*"

  KnowledgeBaseSourceBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3AccessRole
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  KnowledgeBaseSourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KnowledgeBaseSourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt KnowledgeBaseSourceBucket.Arn
              - !Sub "${KnowledgeBaseSourceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  BucketName:
    Description: S3 bucket name for knowledge base documents
    Value: !Ref KnowledgeBaseSourceBucket
  BucketArn:
    Description: S3 bucket ARN
    Value: !GetAtt KnowledgeBaseSourceBucket.Arn
  S3AccessRoleArn:
    Description: ARN of the role with read/write access to the S3 bucket
    Value: !GetAtt S3AccessRole.Arn
